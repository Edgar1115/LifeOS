# LifeOS 默认配置
# 所有秘密信息一律通过环境变量注入，禁止硬编码在 Git 中。
spring:
  application:
    name: lifeos

  datasource:
    # MySQL 是业务事实数据源
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/lifeos?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}

  data:
    redis:
      # Redis 只保存缓存、短期状态和短期对话 Memory，不是业务事实源
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis:
  configuration:
    # 数据库字段下划线自动映射为 Java 驼峰属性
    map-underscore-to-camel-case: true

# Flyway 后续接入时打开（当前离线仓库暂无 Flyway 依赖）
#  flyway:
#    locations: classpath:db/migration

server:
  port: 8080

lifeos:
  jwt:
    # JWT 签名密钥：生产环境必须通过环境变量注入
    secret: ${JWT_SECRET:lifeos-local-dev-secret-change-me}
  llm:
    # LLM Provider 统一走 OpenAiCompatible 网关
    base-url: ${LLM_BASE_URL:}
    api-key: ${LLM_API_KEY:}
  storage:
    # 对象存储类型：local / oss / cos / s3
    type: local
