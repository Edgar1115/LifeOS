# 本地开发配置：只用于本机开发，不包含真实生产秘密。
spring:
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/lifeos?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

lifeos:
  storage:
    # 本地开发使用 Local Storage / MinIO
    type: local