# LifeOS 默认配置
# 所有秘密信息一律通过环境变量注入，禁止硬编码在 Git 中。
spring:
  application:
    name: lifeos

  datasource:
    # MySQL 是业务事实数据源
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/lifeos?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}

  data:
    redis:
      # Redis 只保存缓存、短期状态和短期对话 Memory，不是业务事实源
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

  flyway:
    # 数据库结构版本迁移；脚本默认从 classpath:db/migration 加载
    enabled: true
    # 校验迁移脚本 checksum，防止已执行的迁移被篡改
    validate-on-migrate: true

mybatis:
  configuration:
    # 数据库字段下划线自动映射为 Java 驼峰属性
    map-underscore-to-camel-case: true
  # 自动注册自定义 TypeHandler（UserStatus 按 dbValue 1/0 读写，匹配 V1 status TINYINT）。
  # 不配 default-enum-type-handler：它按枚举名字存，与表结构冲突。
  type-handlers-package: com.edgar.lifeos.infrastructure.persistence.mybatis.typehandler

server:
  port: 8080

lifeos:
  jwt:
    # JWT 签名密钥：生产环境必须通过环境变量注入
    secret: ${JWT_SECRET:lifeos-local-dev-secret-change-me}
  llm:
    # LLM Provider 统一走 OpenAiCompatible 网关
    base-url: ${LLM_BASE_URL:}
    api-key: ${LLM_API_KEY:}
  storage:
    # 对象存储类型：local / oss / cos / s3
    type: local